<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal MPU3221 | IPGKDA (Claymorphism Edition)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-clay: #eef2f9;
            --primary-clay: #2563eb;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-clay);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Claymorphism UI Core Styles */
        .clay-card {
            background: #f0f4fa;
            border-radius: 28px;
            box-shadow: 12px 12px 24px #d1d9e6, -12px -12px 24px #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        .clay-card-subtle {
            background: #eef2f8;
            border-radius: 20px;
            box-shadow: 6px 6px 12px #d1d9e6, -6px -6px 12px #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .clay-input {
            background: #e4ebf5;
            border-radius: 16px;
            box-shadow: inset 4px 4px 8px #c5d0e0, inset -4px -4px 8px #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            outline: none;
            transition: all 0.2s ease;
        }

        .clay-input:focus {
            box-shadow: inset 6px 6px 10px #b8c6dc, inset -6px -6px 10px #ffffff;
            border-color: var(--primary-clay);
        }

        .clay-btn {
            background: linear-gradient(145deg, #2563eb, #1d4ed8);
            border-radius: 18px;
            box-shadow: 6px 6px 12px #c2d0e5, -6px -6px 12px #ffffff;
            color: white;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .clay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 8px 8px 16px #b8c8e2, -8px -8px 16px #ffffff;
        }

        .clay-btn:active {
            transform: translateY(1px);
            box-shadow: inset 4px 4px 8px #153bb8, inset -4px -4px 8px #2d6cff;
        }

        .clay-tab {
            background: #eef2f8;
            border-radius: 16px;
            box-shadow: 4px 4px 8px #d1d9e6, -4px -4px 8px #ffffff;
            color: var(--text-sub);
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .clay-tab.active {
            background: linear-gradient(145deg, #2563eb, #1d4ed8);
            color: white;
            box-shadow: inset 3px 3px 6px #1b44bd, inset -3px -3px 6px #2f80ff;
        }

        .s-card {
            background: #eef2f8;
            border-radius: 18px;
            box-shadow: 4px 4px 8px #d1d9e6, -4px -4px 8px #ffffff;
            transition: all 0.2s ease;
            cursor: pointer;
            border-left: 5px solid transparent;
        }

        .s-card:hover {
            transform: translateY(-2px);
        }

        .s-card.selected {
            border-left-color: #2563eb;
            background: #e2eafc;
            box-shadow: inset 3px 3px 6px #c4d3f2, inset -3px -3px 6px #ffffff;
        }

        .s-card.done {
            border-left-color: #16a34a;
        }

        #toast {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            transform: translateX(140%);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #toast.show {
            transform: translateX(0);
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 sm:p-6">

<!-- NOTIFIKASI TOAST CLAY -->
<div id="toast">
    <div class="clay-card px-6 py-4 flex items-center gap-3 text-sm font-bold shadow-2xl" id="toastMsg"></div>
</div>

<!-- SKRIN LOG MASUK CLAYMORPHISM -->
<div class="min-h-screen flex items-center justify-center" id="loginScreen">
    <div class="clay-card w-full max-w-md p-8 sm:p-10 text-center">
        <div class="w-20 h-20 mx-auto mb-4 clay-card-subtle flex items-center justify-center text-3xl text-blue-600">
            <i class="fas fa-university"></i>
        </div>
        
        <h1 class="text-2xl font-extrabold text-slate-800 mb-1">Portal Pemarkahan</h1>
        <p class="text-xs font-bold text-slate-500 mb-6">MPU3221 — IPG KAMPUS DARULAMAN</p>

        <!-- SUIS TAB LOG MASUK -->
        <div class="flex gap-3 mb-6 p-1.5 clay-card-subtle">
            <button class="clay-tab active flex-1 py-3 text-xs" id="ts" onclick="setType('student')">
                <i class="fas fa-user-graduate me-1"></i> Pelajar
            </button>
            <button class="clay-tab flex-1 py-3 text-xs" id="tl" onclick="setType('lecturer')">
                <i class="fas fa-chalkboard-teacher me-1"></i> Pensyarah
            </button>
        </div>

        <!-- MEDAN INPUT -->
        <div class="space-y-4 mb-6 text-left">
            <div>
                <label class="text-[11px] font-extrabold text-slate-500 uppercase tracking-wider mb-2 block">ID / Emel Rasmi</label>
                <input type="text" id="idIn" placeholder="No. Kad Pengenalan" class="clay-input w-full p-4 text-center font-mono text-sm font-bold">
            </div>
            <div id="pwField" style="display:none;">
                <label class="text-[11px] font-extrabold text-slate-500 uppercase tracking-wider mb-2 block">Kata Laluan Pensyarah</label>
                <input type="password" id="pwIn" placeholder="Masukkan Kata Laluan" class="clay-input w-full p-4 text-center text-sm font-bold">
            </div>
        </div>

        <button onclick="handleAuth()" id="loginBtn" class="clay-btn w-full py-4 text-sm uppercase tracking-wider">
            <i class="fas fa-sign-in-alt me-2"></i> Akses Sistem
        </button>
    </div>
</div>

<!-- DASHBOARD PENSYARAH CLAYMORPHISM -->
<div id="lecturerDash" style="display:none;" class="flex-col min-h-screen">
    <!-- BAR NAVIGASI ATAS -->
    <div class="clay-card p-4 mb-6 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 clay-card-subtle flex items-center justify-center text-blue-600 text-xl font-bold">
                <i class="fas fa-chalkboard-teacher"></i>
            </div>
            <div>
                <div class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">Ruang Kerja Pensyarah</div>
                <div id="lecName" class="text-lg font-bold text-slate-800">--</div>
            </div>
        </div>
        <button onclick="logout()" class="clay-btn bg-red-600 px-5 py-2.5 text-xs">
            <i class="fas fa-sign-out-alt me-1"></i> Log Keluar
        </button>
    </div>

    <!-- UTAMA: SENARAI & MODUL -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
        <!-- SENARAI CALON -->
        <div class="lg:col-span-4 clay-card p-5 h-fit">
            <div class="flex justify-between items-center mb-4">
                <span class="text-xs font-extrabold uppercase text-slate-500">Senarai Calon</span>
                <span id="classInfo" class="text-[11px] font-bold font-mono text-blue-600 bg-blue-100 px-3 py-1 rounded-full">--</span>
            </div>
            <input type="text" id="searchStudent" placeholder="Cari nama atau KP..." class="clay-input w-full p-3 text-xs font-bold mb-4" onkeyup="filterStudents(this.value)">
            <div id="sList" class="space-y-3 max-h-[calc(100vh-280px)] overflow-y-auto p-1"></div>
        </div>

        <!-- PANEL PEMARKAHAN INDUK -->
        <div class="lg:col-span-8 clay-card p-6">
            <div id="gradingEmpty" class="text-center py-20 text-slate-400">
                <i class="fas fa-hand-pointer text-5xl mb-3 opacity-40"></i>
                <h4 class="text-lg font-bold text-slate-600">Pilih Calon Pelajar</h4>
                <p class="text-xs">Sila pilih nama pelajar dari senarai di sebelah kiri untuk memasukkan markah.</p>
            </div>

            <div id="gradingPanel" style="display:none;">
                <div class="clay-card-subtle p-5 mb-6 flex items-center gap-4">
                    <div class="flex-1">
                        <div class="text-[10px] font-extrabold text-slate-400 uppercase">Calon Dinilai</div>
                        <div id="ln" class="text-xl font-bold text-blue-700">--</div>
                        <div id="lk" class="text-xs font-mono text-slate-500 mt-1">--</div>
                    </div>
                </div>

                <!-- KOMPONEN TUGASAN -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-6">
                    <div class="clay-card-subtle p-5">
                        <h4 class="text-xs font-extrabold text-indigo-700 uppercase mb-4">Tugasan 1 (40%)</h4>
                        <div class="space-y-3">
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 uppercase">HP1 — Pengetahuan (Max 30)</label>
                                <input type="number" id="h1" min="0" max="30" step="0.1" oninput="calc()" class="clay-input w-full p-3 font-mono font-bold text-center text-lg">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 uppercase">HP5 — Komunikasi (Max 10)</label>
                                <input type="number" id="h5" min="0" max="10" step="0.1" oninput="calc()" class="clay-input w-full p-3 font-mono font-bold text-center text-lg">
                            </div>
                        </div>
                    </div>

                    <div class="clay-card-subtle p-5">
                        <h4 class="text-xs font-extrabold text-emerald-700 uppercase mb-4">Tugasan 2 (60%)</h4>
                        <div class="space-y-3">
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 uppercase">HP8 — Kepimpinan (Max 30)</label>
                                <input type="number" id="h8" min="0" max="30" step="0.1" oninput="calc()" class="clay-input w-full p-3 font-mono font-bold text-center text-lg">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 uppercase">HP10 — Keusahawanan (Max 30)</label>
                                <input type="number" id="h10" min="0" max="30" step="0.1" oninput="calc()" class="clay-input w-full p-3 font-mono font-bold text-center text-lg">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- KEPUTUSAN AKHIR CLAY -->
                <div class="clay-card p-6 flex justify-between items-center mb-6 bg-slate-800 text-white border-none">
                    <div>
                        <div class="text-xs font-bold text-slate-400 uppercase">Jumlah Markah</div>
                        <div id="tm" class="text-5xl font-black font-mono text-sky-400">0.0</div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs font-bold text-slate-400 uppercase">Gred Akhir</div>
                        <div id="gd" class="text-6xl font-black text-amber-400">F</div>
                    </div>
                </div>

                <button onclick="saveManualScores()" id="saveManualBtn" class="clay-btn w-full py-4 text-sm">
                    <i class="fas fa-save me-2"></i> Simpan Keputusan Markah
                </button>
            </div>
        </div>
    </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbx89KrPdfbC6qc_3l6pZQ4F9LjFMj_Gn8coEIVgba_XpM1dnAJc_8nws7WZt4J4tVpL-w/exec";

let mode = 'student', sData = [], curS = null, curLecEmail = null;

function showToast(msg, type='success') { 
    const t = document.getElementById('toast'), m = document.getElementById('toastMsg'); 
    if(!t || !m) return;
    const icon = type === 'success' ? 'fa-check-circle text-emerald-600' : 'fa-exclamation-triangle text-amber-600'; 
    m.innerHTML = `<i class="fas ${icon} text-lg"></i><span class="text-slate-700">${msg}</span>`; 
    t.classList.add('show'); 
    setTimeout(() => t.classList.remove('show'), 3000); 
}

function calculateGred(m) { 
    if (m>=90) return "A+"; if (m>=80) return "A"; if (m>=75) return "A-"; 
    if (m>=70) return "B+"; if (m>=65) return "B"; if (m>=60) return "B-"; 
    if (m>=55) return "C+"; if (m>=50) return "C"; if (m>=40) return "C-"; 
    if (m>=30) return "D+"; if (m>=20) return "D"; return "F"; 
}

/* FUNGSI TUKAR TAB LOG MASUK */
function setType(t) { 
    mode = t; 
    document.getElementById('ts').classList.toggle('active', t === 'student'); 
    document.getElementById('tl').classList.toggle('active', t === 'lecturer'); 
    document.getElementById('pwField').style.display = (t === 'student') ? 'none' : 'block';
    document.getElementById('idIn').placeholder = (t === 'student') ? 'No. Kad Pengenalan' : 'Emel Rasmi Pensyarah';
}

/* FUNGSI PENGESAHAN LOG MASUK */
async function handleAuth() {
    const id = document.getElementById('idIn').value.trim();
    const pw = document.getElementById('pwIn').value;
    
    if (!id) return showToast('Sila masukkan ID Pengguna atau Emel!', 'warn');
    if (mode === 'lecturer' && !pw) return showToast('Sila masukkan kata laluan!', 'warn');
    
    const btn = document.getElementById('loginBtn'); 
    btn.disabled = true; 
    btn.innerHTML = '<span class="spinner"></span> Mengesahkan...';
    
    try {
        if (mode === 'student') {
            const r = await fetch(`${API}?action=checkLogin&noKP=${encodeURIComponent(id)}`); 
            const o = await r.json();
            if (o.status === "success") { 
                showToast('Akses Pelajar Diterima.', 'success'); 
            } else {
                showToast(o.message, 'warn');
            }
        } else {
            const r = await fetch(`${API}?action=lecturerLogin&email=${encodeURIComponent(id)}&pass=${encodeURIComponent(pw)}`); 
            const o = await r.json();
            if (o.status === "success") { 
                curLecEmail = id; 
                localStorage.setItem('le', id); 
                localStorage.setItem('leName', o.name || id); 
                initLecturer(id, o.name); 
                showToast('Log Masuk Pensyarah Berjaya!', 'success');
            } else { 
                showToast(o.message, 'warn'); 
            }
        }
    } catch (e) { 
        showToast('Ralat sambungan pelayan.', 'warn'); 
    }
    
    btn.disabled = false; 
    btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Akses Sistem';
}

/* PEMULANAN DASHBOARD PENSYARAH */
async function initLecturer(email, name) {
    document.getElementById('loginScreen').style.display = 'none'; 
    document.getElementById('lecturerDash').style.display = 'flex'; 
    document.getElementById('lecName').textContent = name || email; 

    try {
        const r = await fetch(`${API}?action=getLecturerStudents&email=${encodeURIComponent(email)}`); 
        const o = await r.json();
        sData = o.data || []; 
        renderLecStudentList(); 
    } catch(e) { 
        showToast('Gagal memuat senarai pelajar.', 'warn'); 
    }
}

function renderLecStudentList() {
    filterStudents("");
}

function filterStudents(query) {
    const q = query.toLowerCase();
    const filtered = sData.filter(s => s.Nama_Pelajar.toLowerCase().includes(q) || (s.No_KP && s.No_KP.includes(q)));

    document.getElementById('sList').innerHTML = filtered.map(s => {
        const hM = s.markahSediaAda;
        return `<div class="s-card p-4 ${hM?'done':''}" data-kp="${s.No_KP}" onclick="selectStudent('${s.No_KP}')">
            <div class="font-bold text-xs text-slate-800">${s.Nama_Pelajar}</div>
            <div class="text-[10px] font-mono text-slate-500 mt-1">${s.Kelas} · ${s.No_KP}</div>
        </div>`;
    }).join('') || `<div class="text-center p-4 text-xs text-slate-400">Tiada padanan.</div>`;
}

function selectStudent(kp) {
    curS = sData.find(s => s.No_KP.toString() === kp.toString());
    if (!curS) return;

    document.querySelectorAll('#sList .s-card').forEach(c => c.classList.remove('selected'));
    const activeCard = document.querySelector(`#sList .s-card[data-kp="${curS.No_KP}"]`);
    if (activeCard) activeCard.classList.add('selected');
    
    document.getElementById('ln').textContent = curS.Nama_Pelajar;
    document.getElementById('lk').textContent = `ID KP: ${curS.No_KP}`;
    
    document.getElementById('gradingPanel').style.display = 'block';
    document.getElementById('gradingEmpty').style.display = 'none';
    
    if (curS.markahSediaAda) {
        document.getElementById('h1').value = curS.markahSediaAda.hp1 || 0;
        document.getElementById('h5').value = curS.markahSediaAda.hp5 || 0;
        document.getElementById('h8').value = curS.markahSediaAda.hp8 || 0;
        document.getElementById('h10').value = curS.markahSediaAda.hp10 || 0;
    } else {
        ['h1','h5','h8','h10'].forEach(id => document.getElementById(id).value = ''); 
    }
    calc();
}

function calc() {
    const v = ['h1','h5','h8','h10'].map(id => parseFloat(document.getElementById(id)?.value || 0)); 
    const t = v.reduce((a,b) => a+b, 0);
    document.getElementById('tm').textContent = t.toFixed(1); 
    document.getElementById('gd').textContent = calculateGred(t);
}

async function saveManualScores() {
    if(!curS) return;
    const btn = document.getElementById('saveManualBtn');
    btn.disabled = true; 
    btn.innerHTML = '<span class="spinner"></span> Menyimpan...';
    
    try {
        await fetch(API, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify({
                action: "submitScores",
                noKP: curS.No_KP.toString(),
                hp1: parseFloat(document.getElementById('h1').value || 0),
                hp5: parseFloat(document.getElementById('h5').value || 0),
                hp8: parseFloat(document.getElementById('h8').value || 0),
                hp10: parseFloat(document.getElementById('h10').value || 0),
                penilai: curLecEmail
            })
        });
        
        await new Promise(r => setTimeout(r, 1200));
        showToast('Markah berjaya disimpan!', 'success');
        initLecturer(curLecEmail, document.getElementById('lecName').textContent);
    } catch(e) {
        showToast('Ralat menyimpan markah.', 'warn');
    }
    
    btn.disabled = false; 
    btn.innerHTML = '<i class="fas fa-save me-2"></i> Simpan Keputusan Markah';
}

function logout() { localStorage.clear(); location.reload(); }

window.onload = () => { 
    const le = localStorage.getItem('le'); 
    if(le) initLecturer(le, localStorage.getItem('leName')); 
};
</script>
</body>
</html>
